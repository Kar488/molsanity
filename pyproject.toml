[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molsanity"
version = "0.1.0"
description = "Reliability-audit framework for feature attributions on molecular GNNs under scaffold shift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MolSanity contributors" }]
keywords = ["gnn", "explainability", "attribution", "cheminformatics", "molecular", "audit"]

# Core dependencies. Heavy graph/chemistry deps (torch, torch-geometric, rdkit,
# captum) are declared here but may be installed via the CPU wheels index in CI;
# see README for reproduction instructions.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "pillow>=9.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Graph / chemistry stack. Kept optional so the package metadata installs even
# on machines where the heavy wheels are provisioned separately.
graph = [
    "torch>=2.1",
    "torch-geometric>=2.5",
    "captum>=0.7",
    "rdkit>=2023.9",
]
tdc = ["PyTDC>=0.4"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
molsanity = "molsanity.run_all:main"

[tool.setuptools.packages.find]
include = ["molsanity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "heavy: tests that require the full torch/torch-geometric/rdkit stack",
]

[tool.ruff]
line-length = 100
target-version = "py310"
