# Smoke config — CI / minutes. Tiny but honest end-to-end slice.
seed: 0
# Two seeds, so CI exercises the multi-seed path end to end. That path had a
# bug where results rows were keyed without the seed, which would have kept
# only the last seed's results while looking complete; a single-seed smoke
# config cannot catch that.
seeds: [0, 1]
budget:
  epochs: 30
  ig_steps: 15
  max_eval_molecules: 20   # cap audited molecules per cell (labelled in reports)

split:
  kind: scaffold           # primary regime = scaffold shift
  frac_train: 0.8
  frac_val: 0.1

model:
  hidden_channels: 32
  num_layers: 3
  dropout: 0.5
  pool: mean

train:
  lr: 0.001
  weight_decay: 0.0005
  batch_size: 32

# The matrix. Smoke = the smallest slice that still exercises every report:
# MUTAG carries a ground truth, so the rationale-use test, the abstention
# curves and the ground-truth localisation axis all run.
cells:
  - dataset: MUTAG
    backbone: GINE
    attributor: IntegratedGradients
