# Tier-2/3 config — real molecular classification at a budget where models learn
# (the reduced matrix.yaml budget is too low for MoleculeNet-scale sets). Uses the
# class-aware scaffold split + inverse-frequency class weighting so imbalanced
# sets don't collapse to a majority-class predictor. CPU-tractable (minutes-to-
# tens-of-minutes); the large Tox21 (5.8k train) is left to the overnight run.
seed: 0
budget:
  epochs: 60
  ig_steps: 25
  max_eval_molecules: 30

split:
  kind: scaffold
  frac_train: 0.8
  frac_val: 0.1

model:
  hidden_channels: 64
  num_layers: 3
  dropout: 0.5
  pool: mean

train:
  lr: 0.001
  weight_decay: 0.0005
  batch_size: 64
  class_weight: true   # inverse-frequency weighting for imbalanced Tier-2/3

cells:
  # Tier-2 classification (BBBP, BACE) — real molecular property tasks.
  # The gradient battery (Saliency/InputXGradient/GuidedBackprop) + GNNExplainer
  # + PGExplainer on the SAME trained GINE model turns faithfulness-vs-correctness
  # into a cross-dataset MOLECULAR result (not just MUTAG/SynthMotifs). These
  # attributor-adds reuse the committed GINE checkpoint — no retraining.
  - {dataset: BBBP, backbone: GINE, attributor: IntegratedGradients}
  - {dataset: BBBP, backbone: GINE, attributor: Saliency}
  - {dataset: BBBP, backbone: GINE, attributor: InputXGradient}
  - {dataset: BBBP, backbone: GINE, attributor: GuidedBackprop}
  - {dataset: BBBP, backbone: GINE, attributor: GNNExplainer}
  - {dataset: BBBP, backbone: GINE, attributor: PGExplainer}
  - {dataset: BBBP, backbone: GCN,  attributor: IntegratedGradients}
  - {dataset: BBBP, backbone: GAT,  attributor: IntegratedGradients}
  - {dataset: BACE, backbone: GINE, attributor: IntegratedGradients}
  - {dataset: BACE, backbone: GINE, attributor: Saliency}
  - {dataset: BACE, backbone: GINE, attributor: InputXGradient}
  - {dataset: BACE, backbone: GINE, attributor: GNNExplainer}
  - {dataset: BACE, backbone: GCN,  attributor: IntegratedGradients}
  # Tier-3 chemistry-meets-medicine (single-task views)
  - {dataset: SIDER,   backbone: GINE, attributor: IntegratedGradients}
  - {dataset: SIDER,   backbone: GINE, attributor: Saliency}
  - {dataset: SIDER,   backbone: GINE, attributor: InputXGradient}
  - {dataset: SIDER,   backbone: GCN,  attributor: IntegratedGradients}
  - {dataset: SIDER,   backbone: GINE, attributor: GNNExplainer}
  - {dataset: ClinTox, backbone: GINE, attributor: IntegratedGradients}
  - {dataset: ClinTox, backbone: GINE, attributor: Saliency}
  - {dataset: ClinTox, backbone: GINE, attributor: InputXGradient}
  - {dataset: ClinTox, backbone: GINE, attributor: GNNExplainer}
  # Tier-3 Therapeutics Data Commons (TDC): DILI (balanced), hERG (imbalanced)
  - {dataset: DILI, backbone: GINE, attributor: IntegratedGradients}
  - {dataset: DILI, backbone: GINE, attributor: Saliency}
  - {dataset: DILI, backbone: GINE, attributor: InputXGradient}
  - {dataset: DILI, backbone: GINE, attributor: GNNExplainer}
  - {dataset: hERG, backbone: GINE, attributor: IntegratedGradients}
  - {dataset: hERG, backbone: GINE, attributor: Saliency}
  - {dataset: hERG, backbone: GINE, attributor: InputXGradient}
  - {dataset: hERG, backbone: GINE, attributor: GNNExplainer}
  - {dataset: hERG, backbone: GCN,  attributor: IntegratedGradients}
  # Tox21 (single-task NR-AR view): 7.3k molecules, ~4% positive — the largest,
  # most imbalanced set here. Class-aware split + inverse-frequency weighting.
  - {dataset: Tox21, backbone: GINE, attributor: IntegratedGradients}
  - {dataset: Tox21, backbone: GINE, attributor: Saliency}
  - {dataset: Tox21, backbone: GINE, attributor: InputXGradient}
  - {dataset: Tox21, backbone: GINE, attributor: GNNExplainer}
